name: Release plugin

# Builds LabelMaker.dll and publishes it as a GitHub Release when you push a version tag such as v0.1.1.0.
# The tag must equal "v" + the AssemblyVersion in src/LabelMaker/Properties/AssemblyInfo.cs.
# The release text is docs/releases/<tag>.md when that file exists (otherwise GitHub writes a change list).
# You can also start it by hand (Actions tab -> Release plugin -> Run workflow) as a dry run: it builds the DLL and keeps
# it as a downloadable workflow artifact, but publishes nothing.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # only needed to create the GitHub Release
      id-token: write # lets the build prove where the DLL came from (see the attest step)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the plugin version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/.*AssemblyVersion("\([0-9.]*\)").*/\1/p' src/LabelMaker/Properties/AssemblyInfo.cs | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match AssemblyVersion ${version}. Bump the version, commit, then tag again."
            exit 1
          fi

      - name: Build
        # --locked-mode: build only with the exact package versions and hashes recorded in packages.lock.json
        run: |
          dotnet restore src/LabelMaker --locked-mode
          dotnet build src/LabelMaker -c Release --no-restore

      - name: Run the unit tests
        run: dotnet test tests/LabelMaker.Tests

      - name: Name the DLL and write its checksum
        run: |
          mkdir -p dist
          cp src/LabelMaker/bin/Release/net6.0/LabelMaker.dll dist/LabelMaker.dll
          (cd dist && sha256sum LabelMaker.dll > LabelMaker.dll.sha256)
          cat dist/LabelMaker.dll.sha256

      - name: Attest where the DLL came from
        # Signed proof that this exact file was built from this repository by this workflow. Verify a download with:
        #   gh attestation verify LabelMaker.dll --repo feerlessleadr/label-maker-emby
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LabelMaker.dll

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Safe to re-run: if a release for this tag already exists, leave it alone instead of failing.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "A release for ${GITHUB_REF_NAME} already exists; not creating another one."
          else
            notes="docs/releases/${GITHUB_REF_NAME}.md"
            if [ -f "$notes" ]; then
              gh release create "${GITHUB_REF_NAME}" dist/* --title "Label Maker plugin ${GITHUB_REF_NAME}" --notes-file "$notes"
            else
              gh release create "${GITHUB_REF_NAME}" dist/* --title "Label Maker plugin ${GITHUB_REF_NAME}" --generate-notes
            fi
          fi

      - name: Keep the DLL as a workflow artifact (manual dry runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-dll
          path: dist/*
          retention-days: 14
